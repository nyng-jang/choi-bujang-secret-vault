<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 자료실 | 오프라인</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 560px; margin: 0 auto; padding: 56px 22px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    button { font: inherit; padding: 9px 16px; border: 0; border-radius: 10px; background: #8ad8df; color: #0c1520; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>지금은 오프라인입니다</h1>
    <p>인터넷에 연결되지 않아 내 자료실을 열 수 없습니다. 메모는 서버가 로그인과 주인을 확인한 뒤에만 보여 주므로, 이 기기에는 메모를 저장해 두지 않습니다.</p>
    <p>연결되면 아래 버튼을 눌러 다시 시도해 주세요.</p>
    <button type="button" onclick="location.replace('/')">다시 시도</button>
  </main>
</body>
</html>
