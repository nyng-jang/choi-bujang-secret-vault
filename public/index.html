<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; white-space: pre-wrap; }
    form, .bar { display: grid; gap: 10px; margin: 18px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #15233455; }
    .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    label { display: grid; gap: 6px; font-size: 15px; color: #bfd0e5; }
    input, textarea { font: inherit; padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #0c1520; color: #ecf4ff; }
    textarea { min-height: 80px; resize: vertical; }
    button { font: inherit; padding: 9px 16px; border: 0; border-radius: 10px; background: #8ad8df; color: #0c1520; font-weight: 700; cursor: pointer; }
    button.ghost { background: transparent; color: #8ad8df; border: 1px solid #8ad8df; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .mine { display: inline-block; margin-left: 6px; font-size: 13px; color: #8ad8df; }
    .status { min-height: 1.5em; color: #ffd08a; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인</div>
    <h1>점령된 자료실</h1>
    <p>메모는 Supabase에 있고, 서버 함수 <code>/api/notes</code>가 로그인 토큰을 직접 확인한 뒤에만 읽고 씁니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">로그인은 누가 요청했는지 확인할 뿐입니다. 아직은 로그인한 누구나 다른 계정의 메모까지 보고 고칠 수 있으며, 이 문제는 4단계에서 막습니다.</div>

    <form id="login" hidden>
      <label>이메일 <input name="email" type="email" autocomplete="username" required></label>
      <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">로그인</button>
    </form>
    <div class="bar" id="session" hidden>
      <span id="who"></span>
      <button type="button" class="ghost" id="logout">로그아웃</button>
    </div>
    <p class="status" id="status" role="status"></p>

    <form id="add" hidden>
      <label>새 가상 메모 제목 <input name="title" maxlength="100" required></label>
      <label>내용 <textarea name="content" maxlength="2000"></textarea></label>
      <button type="submit">추가</button>
    </form>
    <ul id="notes" aria-live="polite"><li>로그인 상태를 확인하는 중입니다.</li></ul>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script type="module">
    const { createClient } = window.supabase;

    const $ = selector => document.querySelector(selector);
    const list = $('#notes');
    const status = $('#status');
    const say = text => { status.textContent = text; };
    const line = text => { const item = document.createElement('li'); item.textContent = text; return item; };
    let supabase;
    let session = null;

    async function api(method, query = '', body) {
      const headers = { Authorization: `Bearer ${session?.access_token ?? ''}` };
      if (body) headers['Content-Type'] = 'application/json';
      const response = await fetch(`/api/notes${query}`, {
        method, headers, cache: 'no-store', body: body ? JSON.stringify(body) : undefined,
      });
      const data = await response.json().catch(() => ({}));
      if (response.status === 401) throw new Error('로그인이 필요합니다. 다시 로그인해 주세요.');
      if (!response.ok) throw new Error(`요청이 거절되었습니다 (${data.error ?? response.status}).`);
      return data;
    }

    function noteItem(note) {
      const item = document.createElement('li');
      const title = document.createElement('strong');
      const content = document.createElement('span');
      title.textContent = note.title;
      if (note.mine) {
        const mine = document.createElement('small');
        mine.className = 'mine';
        mine.textContent = '내 메모';
        title.append(mine);
      }
      content.textContent = note.content;
      const actions = document.createElement('div');
      actions.className = 'actions';
      const edit = document.createElement('button');
      edit.type = 'button'; edit.className = 'ghost'; edit.textContent = '수정';
      edit.addEventListener('click', () => item.replaceWith(editForm(note)));
      const remove = document.createElement('button');
      remove.type = 'button'; remove.className = 'ghost'; remove.textContent = '삭제';
      remove.addEventListener('click', async () => {
        if (!confirm('이 가상 메모를 삭제할까요?')) return;
        try { await api('DELETE', `?id=${note.id}`); say('삭제했습니다.'); await loadNotes(); }
        catch (error) { say(error.message); }
      });
      actions.append(edit, remove);
      item.append(title, content, actions);
      return item;
    }

    function editForm(note) {
      const item = document.createElement('li');
      const form = document.createElement('form');
      form.innerHTML = '<label>제목 <input name="title" maxlength="100" required></label>'
        + '<label>내용 <textarea name="content" maxlength="2000"></textarea></label>'
        + '<div class="actions"><button type="submit">저장</button><button type="button" class="ghost">취소</button></div>';
      form.elements.title.value = note.title;
      form.elements.content.value = note.content;
      form.querySelector('button.ghost').addEventListener('click', () => loadNotes());
      form.addEventListener('submit', async event => {
        event.preventDefault();
        try {
          await api('PATCH', `?id=${note.id}`, { title: form.elements.title.value, content: form.elements.content.value });
          say('수정했습니다.');
          await loadNotes();
        } catch (error) { say(error.message); }
      });
      item.append(form);
      return item;
    }

    async function loadNotes() {
      if (!session) { list.replaceChildren(line('로그인하면 가상 메모가 보입니다.')); return; }
      try {
        const data = await api('GET');
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        list.replaceChildren(...(data.notes.length ? data.notes.map(noteItem) : [line('메모가 없습니다.')]));
      } catch (error) {
        list.replaceChildren(line(error.message));
      }
    }

    function render() {
      $('#login').hidden = Boolean(session);
      $('#session').hidden = !session;
      $('#add').hidden = !session;
      $('#who').textContent = session ? `로그인 계정: ${session.user.email ?? '이메일 없음'}` : '';
      return loadNotes();
    }

    $('#login').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      say('로그인하는 중입니다.');
      const { error } = await supabase.auth.signInWithPassword({
        email: form.elements.email.value.trim(), password: form.elements.password.value,
      });
      form.elements.password.value = '';
      say(error ? '로그인하지 못했습니다. 이메일과 비밀번호를 확인해 주세요.' : '');
    });

    $('#logout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      say('로그아웃했습니다.');
    });

    $('#add').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      try {
        await api('POST', '', { title: form.elements.title.value, content: form.elements.content.value });
        form.reset();
        say('추가했습니다.');
        await loadNotes();
      } catch (error) { say(error.message); }
    });

    try {
      const response = await fetch('/login-config.json', { cache: 'no-store' });
      if (!response.ok) throw new Error();
      const { supabaseUrl, publishableKey } = await response.json();
      supabase = createClient(supabaseUrl, publishableKey);
      supabase.auth.onAuthStateChange((_event, next) => {
        const changed = next?.access_token !== session?.access_token;
        session = next;
        if (changed) setTimeout(render, 0);
      });
      ({ data: { session } } = await supabase.auth.getSession());
      await render();
    } catch {
      list.replaceChildren(line('로그인 설정을 읽을 수 없습니다. 배포 설정을 확인해 주세요.'));
    }
  </script>
</body>
</html>
